server:
  port: 8081
spring:
  application:
    name: "auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    url: "${URL_DB:jdbc:postgresql://localhost:5432/auth}"
    username: "${USERNAME_DB:postgres}"
    password: "${PASSWORD_DB:mysecretpassword}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddlAuto: "update"
    showSql: "true"
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4173,http://localhost:4200,http://localhost:8080,http://localhost:8082,http://localhost:8081"