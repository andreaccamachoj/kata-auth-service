server:
  port: 8080
spring:
  application:
    name: "auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    url: "${URL_DB:jdbc:postgresql://localhost:5432/auth}"
    username: "${USERNAME_DB:postgres}"
    password: "${PASSWORD_DB:root}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddlAuto: "update"
    showSql: "true"
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}"